# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: minimal
  theme_night: minimal
  font: native
  font_size: M

# SEO

marketing:
  seo:
    site_type: Organization
    local_business_type: 'CollegeOrUniversity'
    org_name: 'SoMeX Lab – Soft Matter eXperiments, University of Vienna'
    description: 'SoMeX is a soft matter experimental research group at the University of Vienna, Austria. We specialize in rheology, rheometry, colloidal suspensions, biophysics, and differential dynamic microscopy (DDM). Led by Roberto Cerbino.'
    twitter: 'somexlab'
  analytics:
    google_analytics: 'G-WJFYZLECLV'
    baidu_tongji: ''
    google_tag_manager: 'G-WJFYZLECLV'
    microsoft_clarity: ''
  verification:
    google: '81inyp-9y8VSKbC-Ivo1hJNp4rAM35jyfiarz3guCMY'
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    align: r
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: true

# Site footer

footer:
  copyright:
    notice: '© {2024} Somex. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    enable: false
    extra_languages:
      - r
      - latex
  math:
    enable: true
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15


# Social sharing buttons
sharing:
  facebook: true
  twitter: true
  linkedin: true
  whatsapp: true
  weibo: false
  email: false

# Extensions

extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style

publications:
  date_format: January 2006
  citation_style: apa

ticker:
  items:
    - text: "📢 ÖGR Meeting: Early Bird Registration"
      url: "/event/2026-11-20-OGR/"
      newtab: true
    - text: "🎉 SPARKHub certification"
      url: "/post/2026/26-09-02-sparkhub/"
      newtab: true
    - text: "🚨 Now member alert"
      url: "/post/2026/26-08-17-sophie_welcome/"
      newtab: false
    #- text: "📜 New preprint: ShearView"
    #  url: "https://arxiv.org/abs/2508.08951"
    #  newtab: true
    - text: "📄 Latest publication: ShearView"
      url: "https://pubs.aip.org/sor/jor/article/70/1/165/3375921/ShearView-A-compact-stress-and-strain-controlled"
      newtab: true